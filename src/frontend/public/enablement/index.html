  <body>
    <div id="root"></div>
    <style>
      #enablement-opening{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;gap:16px;padding:24px;background:#06111f;color:#e5f6ff;text-align:center;font:16px/1.5 system-ui}
      #enablement-opening[hidden]{display:none}
      #enablement-opening p{margin:0}
      #enablement-opening button{min-height:44px;padding:10px 18px;border:1px solid #b6e6ef;border-radius:8px;background:#102837;color:white;font:inherit;cursor:pointer}
    </style>
    <div id="enablement-opening" role="status"><p>Opening Enablement Quest…</p><button id="enablement-retry" type="button" hidden>Reload game</button></div>
    <script>
      (() => {
        const opening = document.getElementById("enablement-opening");
        const retry = document.getElementById("enablement-retry");
        const root = document.getElementById("root");
        const recover = () => {
          if (opening.hidden) return;
          opening.querySelector("p").textContent = "Enablement Quest is taking longer to open. You can reload and try again.";
          retry.hidden = false;
        };
        const timer = window.setTimeout(recover, 15000);
        const observer = new MutationObserver(() => {
          const canvas = root.querySelector("canvas");
          if (!canvas || !canvas.width || !canvas.height) return;
          opening.hidden = true;
          window.clearTimeout(timer);
          observer.disconnect();
        });
        observer.observe(root, {childList: true, subtree: true, attributes: true});
        retry.addEventListener("click", () => window.location.reload());
        window.addEventListener("error", recover, {once: true});
      })();
    </script>
  </body>
