[build]
  command = "corepack pnpm --dir src/frontend build && node scripts/optimize-deployment.mjs"
  publish = "src/frontend/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/admin*"
  to = "/"
  status = 302

[[redirects]]
  from = "/__portfolio/*"
  to = "/"
  status = 404

[[redirects]]
  from = "/enablement"
  to = "/enablement/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/index-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
