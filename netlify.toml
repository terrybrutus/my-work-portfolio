[build]
  command = "corepack pnpm --dir src/frontend test && corepack pnpm --dir src/frontend typecheck && corepack pnpm --dir src/frontend build && node scripts/verify-gif-assets.mjs"
  publish = "src/frontend/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/admin*"
  to = "/"
  status = 302

[[redirects]]
  from = "/__portfolio/*"
  to = "/"
  status = 404

[[redirects]]
  from = "/enablement"
  to = "/enablement/"
  status = 301

[[redirects]]
  from = "/common-thread"
  to = "/common-thread/"
  status = 301

[[redirects]]
  from = "/ai-future-of-work/*"
  to = "https://terrybrutus-aiandthefuture-sample.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/blockchain/*"
  to = "https://whyblockchainmatters-by-terrybrutus.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/phishing/"
  to = "https://phishingcourse-by-terrybrutus.netlify.app/story.html"
  status = 200

[[redirects]]
  from = "/phishing/*"
  to = "https://phishingcourse-by-terrybrutus.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/index-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
